<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>旅行天气地图 · 7天预报</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
            background: #0b1721;
            color: #e8edf3;
            height: 100vh;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100vh;
            z-index: 1;
        }

        /* ---------- 头部 ---------- */
        .header {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(11, 23, 33, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 10px 28px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
            flex-wrap: nowrap;
            white-space: nowrap;
            max-width: calc(100vw - 24px);
        }
        .header h1 {
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap;
        }
        .header .sub {
            font-size: 13px;
            color: #94a3b8;
            white-space: nowrap;
        }
        .header .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #334155;
        }
        .header .refresh-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            padding: 4px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .header .refresh-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #e8edf3;
        }
        .lang-select {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            outline: none;
            font-family: inherit;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .lang-select:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #e8edf3;
        }
        .lang-select option {
            background: #1a2a38;
            color: #e8edf3;
        }
        @media (max-width: 800px) {
            .header .sub,
            .header .dot {
                display: none;
            }
        }

        /* ---------- 自定义标记 ---------- */
        .weather-marker {
            background: rgba(11, 23, 33, 0.9);
            backdrop-filter: blur(8px);
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 6px 12px;
            text-align: center;
            min-width: 64px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            transition: 0.2s;
        }
        .weather-marker:hover {
            border-color: #60a5fa;
            transform: scale(1.05);
        }
        .weather-marker .city-name {
            font-size: 12px;
            font-weight: 600;
            color: #e8edf3;
            margin-bottom: 1px;
        }
        .weather-marker .temp-range {
            font-size: 11px;
            color: #94a3b8;
        }
        .weather-marker .temp-high {
            color: #fbbf24;
        }
        .weather-marker .temp-low {
            color: #60a5fa;
        }
        .weather-marker .weather-icon {
            font-size: 18px;
            line-height: 1.2;
        }

        /* ---------- 详情面板 ---------- */
        .detail-panel {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(11, 23, 33, 0.92);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 24px 32px;
            width: min(820px, calc(100vw - 40px));
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
            display: none;
            transition: 0.3s ease;
            pointer-events: auto;
            max-height: 55vh;
            overflow-y: auto;
        }
        .detail-panel.visible {
            display: block;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .detail-panel .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }
        .detail-panel .panel-header .city-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .detail-panel .panel-header .city-info h2 {
            font-size: 22px;
            font-weight: 700;
        }
        .detail-panel .panel-header .city-info .today-temp {
            font-size: 28px;
            font-weight: 300;
            color: #fbbf24;
        }
        .detail-panel .panel-header .close-btn {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            color: #94a3b8;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .detail-panel .panel-header .close-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #e8edf3;
        }

        /* 7天卡片 */
        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }
        .forecast-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 12px 6px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: 0.2s;
        }
        .forecast-card:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .forecast-card .day-name {
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 6px;
        }
        .forecast-card .fc-icon {
            font-size: 26px;
            margin-bottom: 4px;
        }
        .forecast-card .fc-temp {
            font-size: 14px;
            font-weight: 600;
        }
        .forecast-card .fc-temp .high {
            color: #fbbf24;
        }
        .forecast-card .fc-temp .low {
            color: #60a5fa;
            margin-left: 4px;
        }
        .forecast-card .fc-desc {
            font-size: 11px;
            color: #64748b;
            margin-top: 2px;
        }
        .forecast-card .fc-precip {
            font-size: 11px;
            color: #38bdf8;
            margin-top: 2px;
        }
        .forecast-card.today {
            background: rgba(96, 165, 250, 0.1);
            border-color: rgba(96, 165, 250, 0.2);
        }
        .forecast-card.today .day-name {
            color: #60a5fa;
        }

        /* 图例 */
        .legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(11, 23, 33, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 11px;
            color: #94a3b8;
            line-height: 1.8;
            pointer-events: none;
        }
        .legend span {
            margin-right: 6px;
        }

        /* 加载动画 */
        .loading-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(11, 23, 33, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: 0.5s;
        }
        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(255, 255, 255, 0.06);
            border-top-color: #60a5fa;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .loading-overlay p {
            margin-top: 16px;
            color: #94a3b8;
            font-size: 14px;
        }
        .loading-overlay .sub-loading {
            margin-top: 6px;
            color: #64748b;
            font-size: 12px;
        }

        /* 错误提示 */
        .error-toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(239, 68, 68, 0.9);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 12px 24px;
            display: none;
            align-items: center;
            gap: 16px;
            font-size: 14px;
            color: #fff;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            animation: slideDown 0.3s ease;
        }
        .error-toast.visible {
            display: flex;
        }
        .error-toast button {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 4px 16px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .error-toast button:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* 滚动条 */
        .detail-panel::-webkit-scrollbar {
            width: 4px;
        }
        .detail-panel::-webkit-scrollbar-track {
            background: transparent;
        }
        .detail-panel::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }

        /* 国家中文名称标注 */
        .country-label {
            position: absolute;
            background: none;
            border: none;
            font-size: 12px;
            font-weight: 700;
            color: #2c3e50;
            text-shadow: 0 0 4px rgba(255,255,255,0.9), 0 0 8px rgba(255,255,255,0.7);
            white-space: nowrap;
            pointer-events: none;
            transform: translate(-50%, -50%);
            letter-spacing: 0.5px;
            font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }

        /* 日期选择器 */
        .date-selector {
            position: absolute;
            top: 74px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            gap: 8px;
            background: rgba(11, 23, 33, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 8px 14px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        .date-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #94a3b8;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
            min-width: 52px;
        }
        .date-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #e8edf3;
        }
        .date-btn.active {
            background: rgba(96, 165, 250, 0.25);
            border-color: rgba(96, 165, 250, 0.45);
            color: #e8edf3;
            font-weight: 600;
        }
        .date-btn .day-label {
            display: block;
            font-size: 11px;
            opacity: 0.8;
        }

        /* 移动端响应 */
        @media (max-width: 800px) {
            .header .sub,
            .header .dot {
                display: none;
            }
        }
        @media (max-width: 640px) {
            .header {
                top: 12px;
                padding: 8px 12px;
                gap: 8px;
                flex-wrap: wrap;
                justify-content: center;
                max-width: calc(100vw - 24px);
            }
            .header h1 {
                font-size: 15px;
            }
            .header .sub {
                font-size: 11px;
            }
            .forecast-grid {
                grid-template-columns: repeat(7, 1fr);
                gap: 4px;
            }
            .forecast-card {
                padding: 8px 3px;
            }
            .forecast-card .fc-icon {
                font-size: 20px;
            }
            .forecast-card .fc-temp {
                font-size: 12px;
            }
            .detail-panel {
                padding: 16px;
                bottom: 12px;
                max-height: 45vh;
            }
            .weather-marker {
                padding: 4px 8px;
                min-width: 50px;
            }
            .weather-marker .weather-icon {
                font-size: 14px;
            }
            .weather-marker .city-name {
                font-size: 10px;
            }
            .weather-marker .temp-range {
                font-size: 9px;
            }
        }
    </style>
</head>

    <!-- 加载遮罩 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <p id="loadingText">正在获取天气数据...</p>
        <p class="sub-loading" id="loadingSubtext">全球 400+ 城市 7 天预报</p>
    </div>

    <!-- 错误提示 -->
    <div class="error-toast" id="errorToast">
        <span id="errorMessage">网络异常，请检查后重试</span>
        <button id="retryBtn" onclick="refreshData()">重试</button>
    </div>

    <!-- 地图 -->
    <div id="map"></div>

    <!-- 头部 -->
    <div class="header" id="header">
        <h1 id="headerTitle">🌤 旅行天气地图</h1>
        <span class="sub" id="updateTime">加载中...</span>
        <span class="dot"></span>
        <button class="refresh-btn" onclick="refreshData()">🔄 刷新</button>
        <span class="sub">天气数据 © Open-Meteo</span>
    </div>

    <!-- 日期选择器 -->
    <div class="date-selector" id="dateSelector"></div>

    <!-- 图例 -->
    <div class="legend">
        <span id="legendHigh">🟡 最高温</span>
        <span id="legendLow">🔵 最低温</span>
        <span id="legendPrecip">🌧 降水量</span>
    </div>

    <!-- 详情面板 -->
    <div class="detail-panel" id="detailPanel">
        <div class="panel-header">
            <div class="city-info">

        <div class="forecast-grid" id="forecastGrid"></div>

    <script>
        // ============= WMO 天气码 → 中文描述 + 图标 =============
        function wmoInfo(code) {
            if (code === 0) return { icon: '☀️', desc: '晴' };
            if (code <= 2) return { icon: '⛅', desc: '少云' };
            if (code === 3) return { icon: '☁️', desc: '阴' };
            if (code >= 45 && code <= 48) return { icon: '🌫️', desc: '雾' };
            if (code >= 51 && code <= 55) return { icon: '🌦️', desc: '毛毛雨' };
            if (code >= 56 && code <= 57) return { icon: '🌧️', desc: '冻雨' };
            if (code >= 61 && code <= 65) return { icon: '🌧️', desc: '雨' };
            if (code >= 71 && code <= 77) return { icon: '❄️', desc: '雪' };
            if (code >= 80 && code <= 82) return { icon: '🌦️', desc: '阵雨' };
            if (code >= 85 && code <= 86) return { icon: '🌨️', desc: '阵雪' };
            if (code >= 95) return { icon: '⛈️', desc: '雷暴' };
            return { icon: '🌤️', desc: '未知' };
        }

        // ============= 日期工具 =============
        function getDayName(dateStr, index) {
            const d = new Date(dateStr + 'T00:00:00+08:00');
            const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            if (index === 0) return '今天';
            if (index === 1) return '明天';
            if (index === 2) return '后天';
            return weekdays[d.getDay()];
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr + 'T00:00:00+08:00');
            return `${d.getMonth() + 1}/${d.getDate()}`;
        }

        // ============= UI 工具 =============
        function showError(msg) {
            document.getElementById('errorMessage').textContent = msg;
            document.getElementById('errorToast').classList.add('visible');
        }

        function hideError() {
            document.getElementById('errorToast').classList.remove('visible');
        }

        function setLoadingText(text) {
            document.getElementById('loadingText').textContent = text;
        }

        // ============= 全局变量 =============
        let map, markers = [];
        let markerCluster;
        let allWeatherData = {};
        let selectedDay = 0;  // 0=今天, 1=明天, ... 6

        // ============= 初始化地图 =============
        function initMap() {
            map = L.map('map', {
                center: [25.0, 110.0],
                zoom: 6,
                zoomControl: false,
                attributionControl: true,
                maxBounds: [[-90, -180], [90, 180]],
                maxBoundsViscosity: 1.0,
            });

            // OSM 瓦片通过 Cloudflare Pages Function 代理（解决微信/手机拦截）
            L.tileLayer('/api/tile?p={z}/{x}/{y}&src=carto', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
            }).addTo(map);

            L.control.zoom({ position: 'bottomleft' }).addTo(map);

            map.on('click', function() {
                closeDetail();
            });
        }

        // ============= 国家中文名称标注 =============
        let countryLabelsLayer;

        async function loadCountryLabels() {
            try {
                const resp = await fetch('/static/country_labels.json');
                const labels = await resp.json();

                countryLabelsLayer = L.layerGroup();
                labels.forEach(c => {
                    const marker = L.marker([c.lat, c.lon], {
                        icon: L.divIcon({
                            className: 'country-label',
                            html: c.name,
                            iconSize: [0, 0],
                            iconAnchor: [0, 0],
                        }),
                        interactive: false,
                    });
                    countryLabelsLayer.addLayer(marker);
                });

                // 缩放 ≥ z2.5 时显示，否则隐藏
                const updateLabels = () => {
                    if (map.getZoom() >= 2.5) {
                        if (!map.hasLayer(countryLabelsLayer)) map.addLayer(countryLabelsLayer);
                    } else {
                        if (map.hasLayer(countryLabelsLayer)) map.removeLayer(countryLabelsLayer);
                    }
                };
                map.on('zoomend', updateLabels);
                updateLabels();
            } catch (e) {
                console.warn('国家标注加载失败:', e);
            }
        }

        // ============= 日期选择器 =============
        function renderDateSelector() {
            const container = document.getElementById('dateSelector');
            container.innerHTML = '';

            const today = new Date();
            for (let i = 0; i < 7; i++) {
                const d = new Date(today);
                d.setDate(today.getDate() + i);
                const dateStr = `${d.getMonth() + 1}/${d.getDate()}`;
                const label = i === 0 ? '今天' : (i === 1 ? '明天' : (i === 2 ? '后天' : ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()]));

                const btn = document.createElement('button');
                btn.className = 'date-btn' + (i === selectedDay ? ' active' : '');
                btn.innerHTML = `<span class="day-label">${label}</span>${dateStr}`;
                btn.onclick = () => selectDay(i);
                container.appendChild(btn);
            }
        }

        function selectDay(dayIndex) {
            selectedDay = dayIndex;
            renderDateSelector();
            renderMarkers();
            // 如果详情面板打开，同步刷新
            if (document.getElementById('detailPanel').classList.contains('visible')) {
                const cityName = document.getElementById('detailCityName').textContent;
                if (cityName && cityName !== '—') {
                    showDetail(cityName);
                }
            }
        }

        // ============= 拉取所有城市天气（并发请求每个城市 + 浏览器直连 Open-Meteo） =============
        async function fetchAllWeather() {
            // 检查 localStorage 缓存
            const cachedStr = localStorage.getItem('weatherCache');
            if (cachedStr) {
                try {
                    const cached = JSON.parse(cachedStr);
                    if (Date.now() - cached.ts < 15 * 60 * 1000) {
                        allWeatherData = cached.data;
                        return;
                    }
                } catch (_) {}
            }

            // 分批发（每批 100 城市），406 城市只需 5 个请求
            const BATCH = 100;
            allWeatherData = {};
            const batches = [];
            for (let i = 0; i < cities.length; i += BATCH) {
                batches.push(cities.slice(i, i + BATCH));
            }

            const promises = batches.map(async (batch) => {
                const lats = batch.map(c => c.lat).join(',');
                const lons = batch.map(c => c.lon).join(',');
                const params = new URLSearchParams({
                    latitude: lats,
                    longitude: lons,
                    daily: 'temperature_2m_max,temperature_2m_min,weathercode,precipitation_sum',
                    timezone: 'Asia/Shanghai',
                    forecast_days: 7,
                });
                // 使用 Cloudflare Pages Function 代理（绕过 CORS / 微信拦截）
                setLoadingText('正在拉取 ' + batch[0]?.name + ' 等城市...');
                const proxyUrl = '/api/weather?lats=' + encodeURIComponent(lats) + '&lons=' + encodeURIComponent(lons);
                const res = await fetch(proxyUrl);
                if (!res.ok) throw new Error('代理 HTTP ' + res.status);
                const arr = await res.json();
                if (arr.error) throw new Error('代理: ' + arr.error);
                if (!Array.isArray(arr)) throw new Error('返回非数组');
                return arr;
            });

            const results = await Promise.allSettled(promises);

            // 按返回顺序直接对应（Open-Meteo 返回顺序 = 请求顺序）
            let batchIdx = 0;
            let batchErrors = [];
            results.forEach((r, i) => {
                if (r.status === 'rejected') {
                    batchErrors.push('批' + i + ': ' + (r.reason?.message || r.reason));
                } else {
                    const batchCities = batches[i];
                    r.value.forEach((cityData, j) => {
                        if (!cityData || !cityData.daily) return;
                        const city = batchCities[j];
                        if (!city) return;
                        allWeatherData[city.name] = { daily: cityData.daily };
                    });
                }
            });

            const okCount = Object.keys(allWeatherData).length;
            if (okCount === 0) {
                throw new Error('5 批请求结果: ' + JSON.stringify(batchErrors));
            }
            if (okCount < cities.length * 0.9) {
                console.warn('部分城市匹配失败:', cities.length - okCount);
            }

            // 写入 localStorage 缓存
            try {
                localStorage.setItem('weatherCache', JSON.stringify({ data: allWeatherData, ts: Date.now() }));
            } catch (_) {}
        }

        // ============= 渲染标记（使用 MarkerCluster 分组，缩放更流畅） =============
        function renderMarkers() {
            if (markerCluster) map.removeLayer(markerCluster);
            markerCluster = L.markerClusterGroup({
                chunkedLoading: true,
                chunkInterval: 50,
                spiderfyOnMaxZoom: true,
                showCoverageOnHover: false,
                maxClusterRadius: 50,
            });

            cities.forEach(city => {
                const w = allWeatherData[city.name];
                if (!w || !w.daily) return;

                const daily = w.daily;
                const dayIndex = Math.min(selectedDay, daily.temperature_2m_max.length - 1);
                const tMax = daily.temperature_2m_max[dayIndex];
                const tMin = daily.temperature_2m_min[dayIndex];
                const code = daily.weathercode[dayIndex];
                const wi = wmoInfo(code);

                const html = `
                    <div class="weather-marker">
                        <div class="weather-icon">${wi.icon}</div>
                        <div class="city-name">${city.name}</div>
                        <div class="temp-range">
                            <span class="temp-high">${Math.round(tMax)}°</span>
                            <span class="temp-low">${Math.round(tMin)}°</span>
                        </div>
                    </div>
                `;

                const icon = L.divIcon({
                    html: html,
                    className: '',
                });

                const marker = L.marker([city.lat, city.lon], { icon: icon })
                    .on('click', function(e) {
                        L.DomEvent.stopPropagation(e);
                        showDetail(city.name);
                    });

                markerCluster.addLayer(marker);
            });

            map.addLayer(markerCluster);
            markers = [];
        }

        // ============= 详情面板 =============
        function showDetail(cityName) {
            const w = allWeatherData[cityName];
            if (!w || !w.daily) return;

            const daily = w.daily;
            const dates = daily.time;

            document.getElementById('detailCityName').textContent = cityName;
            const selIdx = Math.min(selectedDay, dates.length - 1);
            document.getElementById('detailTodayTemp').textContent =
                `${Math.round(daily.temperature_2m_max[selIdx])}° / ${Math.round(daily.temperature_2m_min[selIdx])}°`;

            const grid = document.getElementById('forecastGrid');
            grid.innerHTML = '';

            for (let i = 0; i < dates.length; i++) {
                const code = daily.weathercode[i];
                const wi = wmoInfo(code);
                const tMax = Math.round(daily.temperature_2m_max[i]);
                const tMin = Math.round(daily.temperature_2m_min[i]);
                const precip = daily.precipitation_sum[i] ?? 0;

                const card = document.createElement('div');
                card.className = 'forecast-card' + (i === selIdx ? ' today' : '');
                card.innerHTML = `
                    <div class="day-name">${getDayName(dates[i], i)} ${formatDate(dates[i])}</div>
                    <div class="fc-icon">${wi.icon}</div>
                    <div class="fc-temp">
                        <span class="high">${tMax}°</span>
                        <span class="low">${tMin}°</span>
                    </div>
                    <div class="fc-desc">${wi.desc}</div>
                    <div class="fc-precip">${precip > 0 ? '💧' + precip.toFixed(1) + 'mm' : ''}</div>
                `;
                grid.appendChild(card);
            }

            document.getElementById('detailPanel').classList.add('visible');
        }

        function closeDetail() {
            document.getElementById('detailPanel').classList.remove('visible');
        }

        // ============= 更新时间显示 =============
        function updateTimeDisplay() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('updateTime').textContent = `更新于 ${h}:${m}`;
        }

        // ============= 主流程 =============
        async function refreshData() {
            hideError();
            document.getElementById('loadingOverlay').classList.remove('hidden');
            closeDetail();
            setLoadingText('正在获取天气数据...');

            try {
                // 设置 30 秒超时
                const timeoutPromise = new Promise((_, reject) =>
                    setTimeout(() => reject(new Error('请求超时, 请检查网络')), 30000)
                );
                await Promise.race([fetchAllWeather(), timeoutPromise]);
                const cityCount = Object.keys(allWeatherData).length;

                if (cityCount > 0) {
                    renderMarkers();
                    updateTimeDisplay();
                    // 大部分城市成功（>90%）就不显示警告
                    if (cityCount < cities.length * 0.9) {
                        showError(`已显示 ${cityCount}/${cities.length} 个城市`);
                    }
                } else {
                    showError('[v3] 全部城市失败: 0/' + cities.length);
                }
            } catch (e) {
                console.error('[v3] 数据获取失败:', e);
                showError('[v3] 失败: ' + (e.message || e));
            } finally {
                document.getElementById('loadingOverlay').classList.add('hidden');
            }
        }

        // ============= 启动 =============
        initMap();
        renderDateSelector();
        loadCountryLabels();
        refreshData();

        // 每小时自动刷新
        setInterval(refreshData, 60 * 60 * 1000);
    </script>
</body>
</html>
